{% set python_min = "3.10" %}
{% set name = "txl-local-terminals" %}
{% set version = "0.3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/txl_local_terminals-{{ version }}.tar.gz
  sha256: a266748a8b39f0d931bd9913c2c143b2efd411ad461b62b7726160350add2957

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2
    - __unix  # [unix]
    - __win  # [win]
    - pywinpty  # [win]
    - anyio >=3.7.0,<5

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_local_terminals

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/local_terminals
  summary: TXL plugin for local terminals
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/local_terminals
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
